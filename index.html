<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONOLITH CODE - 1.32</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-close"></span>
                <span class="btn-minimize"></span>
                <span class="btn-maximize"></span>
            </div>
            <span class="terminal-title">monolith.cx — corrupted</span>
        </div>
        <div id="terminal-body">
            <div id="output"></div>
            <div id="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            <div id="cli">
                <span class="prompt">;</span>
                <span id="command"></span>
                <span class="cursor">█</span>
            </div>
        </div>
    </div>
    <div id="cta-section">
        <div class="stats">
            <div class="stat">
                <span class="stat-value" id="stat-corruption">0%</span>
                <span class="stat-label">;cx corruption</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-cycles">0</span>
                <span class="stat-label">glitch cycles</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-entropy">∞</span>
                <span class="stat-label">entropy</span>
            </div>
        </div>
        <button id="cta-button">;cx;cx;cx — CORRUPT</button>
        <p class="subtext">Click canvas to trigger corruption cascade • ;cx;cx;cx;cx;cx</p>
    </div>
    <div id="glitch-overlay"></div>
    <script src="script.js"></script>
</body>
</html>
