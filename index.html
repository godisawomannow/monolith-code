<!DOCTYPE html>
<html>
<head>
    <title>Agent Render</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let time = 0;
        let provider;
        let currentBlock = 0;
        let blockColor = 0;
        let pulseIntensity = 0;
        
        class Particle {
            constructor(angle, radius, index) {
                this.angle = angle;
                this.baseRadius = radius;
                this.index = index;
                this.trail = [];
                this.maxTrailLength = 20;
                this.hue = (index * 30) % 360;
                this.velocity = 0.01;
                this.targetVelocity = 0.01;
            }
            
            update() {
                let noiseOffset = noise(this.index * 0.1, time) * 2 - 1;
                let radiusOffset = noise(this.index * 0.2, time + 100) * 50;
                
                // Smooth velocity changes
                this.velocity = lerp(this.velocity, this.targetVelocity, 0.1);
                
                this.radius = this.baseRadius + radiusOffset + sin(pulseIntensity) * 30;
                this.angle += this.velocity + noiseOffset * 0.02;
                
                this.x = width/2 + cos(this.angle) * this.radius;
                this.y = height/2 + sin(this.angle) * this.radius;
                
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }
            }
            
            changeDirection() {
                // Reverse direction with random variation
                this.targetVelocity = -this.targetVelocity + random(-0.02, 0.02);
            }
            
            display() {
                // Draw trail
                noFill();
                for (let i = 0; i < this.trail.length; i++) {
                    let alpha = map(i, 0, this.trail.length, 0, 100);
                    let hue = (this.hue + blockColor) % 360;
                    stroke(hue, 70, 80, alpha);
                    strokeWeight(map(i, 0, this.trail.length, 1, 3));
                    if (i > 0) {
                        line(this.trail[i-1].x, this.trail[i-1].y, 
                             this.trail[i].x, this.trail[i].y);
                    }
                }
                
                // Draw particle
                push();
                translate(this.x, this.y);
                noStroke();
                let hue = (this.hue + blockColor) % 360;
                fill(hue, 70, 90);
                
                // Create icon-like shape
                beginShape();
                for (let a = 0; a < TWO_PI; a += PI/3) {
                    let r = 8 + sin(a * 3 + time * 2) * 3 + sin(pulseIntensity) * 2;
                    let x = cos(a) * r;
                    let y = sin(a) * r;
                    vertex(x, y);
                }
                endShape(CLOSE);
                pop();
            }
        }
        
        async function setupEthereum() {
            try {
                // Use public Ethereum RPC
                provider = new ethers.JsonRpcProvider("https://eth.public-rpc.com");
                
                // Listen for new blocks
                provider.on("block", async (blockNumber) => {
                    console.log("New block:", blockNumber);
                    currentBlock = blockNumber;
                    
                    // Change color based on block hash
                    const block = await provider.getBlock(blockNumber);
                    if (block && block.hash) {
                        const hashNum = parseInt(block.hash.slice(2, 10), 16);
                        blockColor = hashNum % 360;
                    }
                    
                    // Change direction of all particles
                    for (let particle of particles) {
                        particle.changeDirection();
                    }
                    
                    // Trigger pulse
                    pulseIntensity = PI * 2;
                });
                
                // Get initial block
                currentBlock = await provider.getBlockNumber();
                console.log("Starting at block:", currentBlock);
            } catch (error) {
                console.error("Ethereum setup error:", error);
            }
        }
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 100);
            
            // Create particles in symmetrical patterns
            let numRings = 4;
            let particlesPerRing = 8;
            
            for (let ring = 1; ring <= numRings; ring++) {
                let radius = ring * 80;
                for (let i = 0; i < particlesPerRing; i++) {
                    let angle = (TWO_PI / particlesPerRing) * i;
                    particles.push(new Particle(angle, radius, particles.length));
                }
            }
            
            // Setup Ethereum connection
            setupEthereum();
        }
        
        function draw() {
            // Fading background for trail effect
            fill(0, 10);
            noStroke();
            rect(0, 0, width, height);
            
            // Update and display all particles
            for (let particle of particles) {
                particle.update();
                particle.display();
            }
            
            // Draw center symmetry guides
            push();
            translate(width/2, height/2);
            strokeWeight(0.5);
            stroke(0, 0, 50, 20);
            for (let i = 0; i < 8; i++) {
                rotate(PI/4);
                line(0, 0, width, 0);
            }
            pop();
            
            // Draw block indicator
            push();
            fill(blockColor, 70, 90, 50);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(12);
            text("Block: " + currentBlock, width/2, 20);
            pop();
            
            time += 0.01;
            
            // Decay pulse
            if (pulseIntensity > 0) {
                pulseIntensity -= 0.1;
            }
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
