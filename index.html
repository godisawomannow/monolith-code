<!DOCTYPE html>
<html>
<head>
    <title>Agent Render</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toolbar">
        <div class="tool-group">
            <button class="tool active" data-tool="pencil">✏️</button>
            <button class="tool" data-tool="eraser">🧹</button>
            <button class="tool" data-tool="fill">🪣</button>
            <button class="tool" data-tool="eyedropper">💉</button>
        </div>
        <div class="color-palette">
            <input type="color" id="color-picker" value="#00ff00">
            <div class="preset-colors"></div>
        </div>
        <div class="controls">
            <button id="clear-btn">Clear</button>
            <button id="grid-toggle">Grid</button>
            <button id="save-btn">Save</button>
            <div class="size-control">
                Size: <input type="range" id="pixel-size" min="8" max="32" value="16">
                <span id="size-display">16</span>
            </div>
        </div>
    </div>
    <div id="info">
        <div>Tool: <span id="current-tool">pencil</span></div>
        <div>Color: <span id="current-color" style="color: #00ff00">#00ff00</span></div>
        <div>Grid: <span id="grid-size">0x0</span></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
