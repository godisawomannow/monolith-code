<!DOCTYPE html>
<html>
<head>
    <title>Agent Render</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>
    <script>
        let particles = [];
        let time = 0;
        
        class Particle {
            constructor(angle, radius, index) {
                this.angle = angle;
                this.baseRadius = radius;
                this.index = index;
                this.trail = [];
                this.maxTrailLength = 20;
                this.hue = (index * 30) % 360;
            }
            
            update() {
                let noiseOffset = noise(this.index * 0.1, time) * 2 - 1;
                let radiusOffset = noise(this.index * 0.2, time + 100) * 50;
                
                this.radius = this.baseRadius + radiusOffset;
                this.angle += 0.01 + noiseOffset * 0.02;
                
                this.x = width/2 + cos(this.angle) * this.radius;
                this.y = height/2 + sin(this.angle) * this.radius;
                
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }
            }
            
            display() {
                // Draw trail
                noFill();
                for (let i = 0; i < this.trail.length; i++) {
                    let alpha = map(i, 0, this.trail.length, 0, 100);
                    stroke(this.hue, 70, 80, alpha);
                    strokeWeight(map(i, 0, this.trail.length, 1, 3));
                    if (i > 0) {
                        line(this.trail[i-1].x, this.trail[i-1].y, 
                             this.trail[i].x, this.trail[i].y);
                    }
                }
                
                // Draw particle
                push();
                translate(this.x, this.y);
                noStroke();
                fill(this.hue, 70, 90);
                
                // Create icon-like shape
                beginShape();
                for (let a = 0; a < TWO_PI; a += PI/3) {
                    let r = 8 + sin(a * 3 + time * 2) * 3;
                    let x = cos(a) * r;
                    let y = sin(a) * r;
                    vertex(x, y);
                }
                endShape(CLOSE);
                pop();
            }
        }
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 100);
            
            // Create particles in symmetrical patterns
            let numRings = 4;
            let particlesPerRing = 8;
            
            for (let ring = 1; ring <= numRings; ring++) {
                let radius = ring * 80;
                for (let i = 0; i < particlesPerRing; i++) {
                    let angle = (TWO_PI / particlesPerRing) * i;
                    particles.push(new Particle(angle, radius, particles.length));
                }
            }
        }
        
        function draw() {
            // Fading background for trail effect
            fill(0, 10);
            noStroke();
            rect(0, 0, width, height);
            
            // Update and display all particles
            for (let particle of particles) {
                particle.update();
                particle.display();
            }
            
            // Draw center symmetry guides
            push();
            translate(width/2, height/2);
            strokeWeight(0.5);
            stroke(0, 0, 50, 20);
            for (let i = 0; i < 8; i++) {
                rotate(PI/4);
                line(0, 0, width, 0);
            }
            pop();
            
            time += 0.01;
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
