<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Render</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .draggable {
            width: 50px;
            height: 50px;
            cursor: move;
        }
    </style>
</head>
<body>
    <svg class="draggable" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
        <circle cx="12" cy="12" r="10" />
    </svg>
    <script>
        const draggable = document.querySelector('.draggable');
        let isDragging = false;
        let offset = { x: 0, y: 0 };

        draggable.addEventListener('mousedown', (e) => {
            isDragging = true;
            offset.x = e.clientX - draggable.getBoundingClientRect().left;
            offset.y = e.clientY - draggable.getBoundingClientRect().top;
            document.body.style.userSelect = 'none'; // Prevent text selection
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                draggable.style.position = 'absolute';
                draggable.style.left = (e.clientX - offset.x) + 'px';
                draggable.style.top = (e.clientY - offset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.style.userSelect = ''; // Restore text selection
        });
    </script>
</body>
</html>
