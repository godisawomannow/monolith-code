<!DOCTYPE html>
<html>
<head>
    <title>Agent Render</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toolbar">
        <div class="tool-group">
            <button class="tool active" data-tool="pencil" title="Pencil (P)">✏️</button>
            <button class="tool" data-tool="eraser" title="Eraser (E)">🧹</button>
            <button class="tool" data-tool="fill" title="Fill (F)">🪣</button>
            <button class="tool" data-tool="eyedropper" title="Eyedropper (I)">💉</button>
        </div>
        <div class="color-palette">
            <input type="color" id="color-picker" value="#00ff00">
            <div class="preset-colors"></div>
        </div>
        <div class="controls">
            <button id="clear-btn">Clear</button>
            <button id="grid-toggle">Grid</button>
            <button id="save-btn">Save</button>
        </div>
    </div>
    <div id="info">
        <div>Tool: <span id="current-tool">pencil</span></div>
        <div>Color: <span id="current-color" style="color: #00ff00">#00ff00</span></div>
        <div>Rotation: <span id="rotation-info">0°, 0°</span></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
