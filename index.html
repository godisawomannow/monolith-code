<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Render</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            cursor: none;
        }
        #icon {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            transition: none;
        }
        button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="icon">
        <svg width="30" height="30" xmlns="http://www.w3.org/2000/svg">
            <circle cx="15" cy="15" r="12" fill="#fff" />
        </svg>
    </div>
    <button onclick="changeShape()">Change Shape</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const icon = document.getElementById('icon');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let mouseX = 0;
        let mouseY = 0;
        let trail = [];
        let currentShape = 0;
        const shapes = ['circle', 'square', 'triangle', 'star'];
        
        const maxTrailLength = 30;
        
        function drawShape(shape, size) {
            const svg = icon.querySelector('svg');
            svg.innerHTML = '';
            
            switch(shape) {
                case 'circle':
                    svg.innerHTML = '<circle cx="15" cy="15" r="12" fill="#fff" />';
                    break;
                case 'square':
                    svg.innerHTML = '<rect x="3" y="3" width="24" height="24" fill="#fff" />';
                    break;
                case 'triangle':
                    svg.innerHTML = '<polygon points="15,3 27,27 3,27" fill="#fff" />';
                    break;
                case 'star':
                    svg.innerHTML = '<polygon points="15,2 19,11 28,11 21,17 23,26 15,21 7,26 9,17 2,11 11,11" fill="#fff" />';
                    break;
            }
        }
        
        function changeShape() {
            currentShape = (currentShape + 1) % shapes.length;
            drawShape(shapes[currentShape], 30);
        }
        
        function getIridescentColor(index, total) {
            const hue = (index / total) * 360 + (Date.now() / 10) % 360;
            const lightness = 50 + (index / total) * 30;
            return `hsl(${hue}, 100%, ${lightness}%)`;
        }
        
        function drawTrail() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < trail.length; i++) {
                const point = trail[i];
                const alpha = i / trail.length;
                const size = (i / trail.length) * 15 + 2;
                
                ctx.beginPath();
                ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                ctx.fillStyle = getIridescentColor(i, trail.length);
                ctx.globalAlpha = alpha * 0.7;
                ctx.fill();
            }
            
            ctx.globalAlpha = 1;
        }
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            icon.style.left = (mouseX - 15) + 'px';
            icon.style.top = (mouseY - 15) + 'px';
            
            trail.push({ x: mouseX, y: mouseY });
            
            if (trail.length > maxTrailLength) {
                trail.shift();
            }
        });
        
        function animate() {
            drawTrail();
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        animate();
    </script>
</body>
</html>
